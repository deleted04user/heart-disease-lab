name: Portable release verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-linux-portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.13'
          enable-cache: true
      - name: Install serving dependencies only
        run: |
          uv venv .venv --python 3.13
          uv pip sync --require-hashes deploy/requirements-lock.txt
      - name: Download the pinned published archive
        run: .venv/bin/python scripts/download_release.py
      - name: Verify without the original source data or editable package
        run: .venv/bin/python scripts/verify_release.py --output reports/portable_ci_verification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-linux-verification
          path: reports/portable_ci_verification.json
          retention-days: 14
