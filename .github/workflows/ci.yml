name: Tests and application checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Enforce lint, formatting and package typing
        run: |
          uv run --locked ruff check src scripts app.py tests deploy
          uv run --locked ruff format --check src scripts app.py tests deploy
          uv run --locked mypy src
      - name: Verify lockfile exports and dependency compatibility
        run: |
          uv lock --check
          uv export --locked --no-emit-project --no-dev --no-hashes --output-file requirements.txt --quiet
          uv export --locked --no-emit-project --no-dev --extra dev --output-file requirements-lock.txt --quiet
          git diff --exit-code -- requirements.txt requirements-lock.txt uv.lock
          uv pip check
      - name: Audit pinned dependencies
        run: |
          uv run --locked pip-audit -r requirements-lock.txt --no-deps --disable-pip --strict --progress-spinner off
          uv run --locked pip-audit -r deploy/requirements-lock.txt --no-deps --disable-pip --strict --progress-spinner off
      - name: Verify the audit rejects a known vulnerable fixture without installation
        run: uv run --locked python scripts/verify_audit_gate.py
      - name: Build installable distributions
        run: uv build

  unit-and-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Offline unit, workflow and Streamlit interaction tests
        run: uv run --locked pytest --cov --cov-report=xml --cov-report=term-missing:skip-covered
      - name: Syntax and dependency checks
        run: |
          uv run --locked python -m compileall -q src scripts app.py tests deploy
          uv pip check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build isolated test image and run its suite
        run: |
          docker build --target development -t heart-disease-tests .
          docker run --rm heart-disease-tests
      - name: Build serving image and verify its process health
        run: |
          docker build --target runtime -t heart-disease-demo .
          docker run --rm heart-disease-demo python scripts/verify_cloud.py
          docker compose config --quiet
          docker run -d --name heart-disease-demo -p 127.0.0.1:8502:8501 heart-disease-demo
          python scripts/verify_container.py --url http://127.0.0.1:8502 --timeout 60
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs heart-disease-demo 2>/dev/null || true
          docker rm -f heart-disease-demo 2>/dev/null || true
