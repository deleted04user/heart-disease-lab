name: Manual real-data integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.0'
          python-version: '3.13'
          enable-cache: true
      - name: Install project
        run: uv sync --locked --extra dev
      - name: Obtain the two official sources
        run: |
          uv run --locked python scripts/download_data.py
          uv run --locked python scripts/download_external.py
      - name: Full training and audited transfer check
        run: uv run --locked python scripts/train.py --external data/raw/processed.hungarian.data
      - name: Verify immutable experiment without deserialization
        shell: bash
        run: |
          run_dir=$(uv run --locked python -c "import json; print(json.load(open('reports/active_run.json'))['run_dir'])")
          uv run --locked python scripts/verify_experiment.py "$run_dir"
      - name: Verify reports, reloaded metrics and populated UI
        run: uv run --locked python scripts/verify_run.py --require-external
      - name: Retain aggregate evidence (no raw data or models)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heart-disease-aggregate-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
