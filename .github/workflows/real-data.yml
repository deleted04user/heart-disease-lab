name: Manual real-data integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project
        run: python -m pip install -r requirements.txt -e .
      - name: Obtain the two official sources
        run: |
          python scripts/download_data.py
          python scripts/download_external.py
      - name: Full training and audited transfer check
        run: python scripts/train.py --external data/raw/processed.hungarian.data
      - name: Verify reports, reloaded metrics and populated UI
        run: python scripts/verify_run.py --require-external
      - name: Retain aggregate evidence (no raw data or models)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: heart-disease-aggregate-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
