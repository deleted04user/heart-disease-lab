[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-lab"
version = "1.3.1"
license = "MIT"
readme = "README.md"
description = "Reproducible UCI heart disease classification and educational dashboard"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<0.14",
    "streamlit>=1.50,<2",
    "joblib>=1.4,<2",
    "xgboost>=2.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "pip-audit>=2.10,<3",
    "pandas-stubs>=2.3,<3",
    "types-seaborn>=0.13,<0.14",
    "types-requests>=2.32,<3",
]

[project.urls]
Repository = "https://github.com/deleted04user/heart-disease-lab"
Issues = "https://github.com/deleted04user/heart-disease-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Direct execution locates the source package before importing it.
"app.py" = ["E402"]
"scripts/_common.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src/heart_disease"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
show_error_codes = true
pretty = false

[[tool.mypy.overrides]]
# These scientific libraries do not publish complete typing information.
module = ["sklearn.*", "joblib.*", "xgboost.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["heart_disease", "app"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
